services:
  # Handelt TLS af en zet alles door naar de app-container. Dit is de enige
  # service die poorten op de Pi publiceert; de app is van buitenaf niet
  # rechtstreeks te bereiken.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Poort 80 wordt door de provider geblokkeerd en is van buiten dus
      # onbereikbaar. Hij blijft staan voor het bereiken van de site binnen je
      # eigen netwerk en via de 8080-regel in de router.
      - "80:80"
      - "443:443"
    env_file: .env.proxy
    environment:
      # Zonder dit filter zou het image ook andere omgevingsvariabelen in de
      # template proberen in te vullen.
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      - ./docker/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - app

  # Draait niet mee met `docker compose up`: het profiel zorgt dat deze service
  # alleen opstart als je hem expliciet aanroept met `docker compose run`.
  # Verlengen gebeurt via docker/renew-cert.sh op een cronjob, niet vanuit een
  # container die eeuwig staat te wachten.
  certbot:
    image: certbot/certbot:latest
    profiles:
      - cert
    volumes:
      - certbot-conf:/etc/letsencrypt

  app:
    build: .
    image: vakantie:latest
    restart: unless-stopped
    # expose in plaats van ports: alleen bereikbaar vanaf de proxy, niet vanaf
    # het netwerk waar de Pi in hangt.
    expose:
      - "80"
    env_file: .env.docker
    volumes:
      # Het enige dat de app nog bewaart: het SQLite-bestand. Een submap,
      # want een volume op database/ zelf zou de migrations verbergen die
      # in het image zitten.
      - vakantie-db:/var/www/html/database/sqlite

volumes:
  vakantie-db:
  certbot-conf:
