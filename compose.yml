services:
  # Handelt https af, haalt het certificaat op en verlengt het. Dit is de enige
  # service die poorten op de Pi publiceert; de app is van buitenaf niet
  # rechtstreeks te bereiken.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Poort 80 wordt door de provider geblokkeerd en is van buiten dus
      # onbereikbaar. Hij blijft staan zodat de site binnen je eigen netwerk
      # bereikbaar is; Caddy stuurt daar door naar https.
      - "80:80"
      - "443:443"
    env_file: .env.proxy
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # De losse pagina op het kale domein. Alleen-lezen: Caddy hoeft er niets
      # te schrijven, en zo kan een fout in de config er nooit iets slopen.
      - ./site:/srv/site:ro
      # Hier staan de certificaten. Dit volume moet blijven bestaan, anders
      # vraagt Caddy bij elke herstart een nieuw certificaat aan en loop je
      # tegen de limiet van Let's Encrypt aan.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    build: .
    image: vakantie:latest
    restart: unless-stopped
    # expose in plaats van ports: alleen bereikbaar vanaf Caddy, niet vanaf
    # het netwerk waar de Pi in hangt.
    expose:
      - "80"
    env_file: .env.docker
    volumes:
      # Het enige dat de app nog bewaart: het SQLite-bestand. Een submap,
      # want een volume op database/ zelf zou de migrations verbergen die
      # in het image zitten.
      - vakantie-db:/var/www/html/database/sqlite

volumes:
  vakantie-db:
  caddy-data:
  caddy-config:
