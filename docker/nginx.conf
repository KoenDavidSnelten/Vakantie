user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # De app uploadt niets meer; dit dekt alleen nog gewone formulierposts.
    client_max_body_size 2m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        charset utf-8;

        root  /var/www/html/public;
        index index.php;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Vite hasht de bestandsnamen, dus deze mogen lang gecachet worden.
        location /build/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            # internal: alleen bereikbaar via de try_files hierboven, niet
            # rechtstreeks op te vragen.
            internal;

            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
        }

        # Geen enkel ander .php-bestand mag uitgevoerd worden.
        location ~ \.php$ {
            return 404;
        }

        # Verborgen bestanden (.env, .git) nooit uitserveren.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
