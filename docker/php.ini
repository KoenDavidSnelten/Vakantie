memory_limit = 256M
expose_php = Off

; De app slaat geen bestanden meer op, dus uploads kunnen helemaal uit.
file_uploads = Off
post_max_size = 2M

; validate_timestamps uit: de code verandert alleen als er een nieuw image
; wordt gedraaid, en dan start het proces toch opnieuw op.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
