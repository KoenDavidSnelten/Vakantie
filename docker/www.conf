[www]
user = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Afgestemd op een Pi 4B: genoeg voor een handvol gelijktijdige bezoekers
; zonder het geheugen vol te zetten.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Zonder dit ziet PHP de omgevingsvariabelen uit compose's env_file niet.
clear_env = no

; PHP-fouten naar de containerlog in plaats van naar een bestand.
catch_workers_output = yes
decorate_workers_output = no
